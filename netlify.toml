# Netlify 构建配置
# 密钥扫描说明：
# Netlify 会把站点环境变量中所有 key 的值都当作"密钥"扫描仓库代码与构建产物。
# 下列环境变量属于"非密钥"配置值（模型名、超时毫秒数、思考开关、公开 API 网关地址），
# 它们出现在源码 / 文档 / 示例文件中是完全正常的，因此从扫描中排除，避免误报阻塞部署。
# 真正的密钥（GLM_API_KEY、SOPHNET_API_KEY、SILICONFLOW_API_KEY、EAZO_PRIVATE_KEY、
# DATABASE_URL、STEP_API_KEY、NEXT_PUBLIC_AMAP_* 等）不在此列表中，仍受扫描保护。
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GLM_MODEL,GLM_BASE_URL,GLM_TIMEOUT_MS,GLM_REASONING_HEADROOM,GLM_THINKING,SOPHNET_TTS_MODEL,SOPHNET_TTS_URL,SOPHNET_TTS_VOICE,SILICONFLOW_BASE_URL,XINGYUN_GATEWAY_SERVER,XINGYUN_XIAOMEI_GATEWAY_SERVER"
